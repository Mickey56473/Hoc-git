<!DOCTYPE html>
<html>
<head>
<title>FlaskTube</title>

<style>
:root{
    --bg:#f5f5f5;
    --card:#fff;
    --text:#000;
}

body.dark{
    --bg:#181818;
    --card:#242424;
    --text:#fff;
}

body{
    font-family: Arial;
    margin:0;
    background:var(--bg);
    color:var(--text);
    transition:0.3s;
}

/* Navbar */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:var(--card);
}

.logo{
    color:red;
    font-weight:bold;
}

.toggle-btn{
    padding:6px 12px;
    border-radius:20px;
    border:none;
    cursor:pointer;
}

/* Grid */
.container{
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
}

/* Card */
.card{
    background:var(--card);
    border-radius:10px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:10px;
}

.title{
    font-weight:bold;
}

/* Like button */
.like-btn{
    margin-top:10px;
    padding:6px 12px;
    border:none;
    border-radius:20px;
    background:#ddd;
    cursor:pointer;
    transition:0.3s;
}

.like-btn:hover{
    background:red;
    color:white;
}

/* Progress bar */
.progress{
    height:5px;
    background:#ccc;
    margin-top:8px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:red;
    animation:load 3s forwards;
}

@keyframes load{
    from{width:0%;}
    to{width:70%;}
}

</style>
</head>

<body>

<div class="navbar">
    <div class="logo">▶ FlaskTube</div>
    <button class="toggle-btn" onclick="toggleMode()">Dark / Light</button>
</div>

<div class="container">
    <div class="grid">

        <!-- Card -->
        <div class="card">
            <img src="img1.jpg">
            <div class="card-content">
                <div class="title">Wonders of Los Angeles</div>

                <div class="progress">
                    <div class="progress-bar"></div>
                </div>

                <button class="like-btn">❤️ Like</button>
            </div>
        </div>

        <div class="card">
            <img src="img2.jpg">
            <div class="card-content">
                <div class="title">Video 2</div>

                <div class="progress">
                    <div class="progress-bar"></div>
                </div>

                <button class="like-btn">❤️ Like</button>
            </div>
        </div>

        <div class="card">
            <img src="img3.jpg">
            <div class="card-content">
                <div class="title">Video 3</div>

                <div class="progress">
                    <div class="progress-bar"></div>
                </div>

                <button class="like-btn">❤️ Like</button>
            </div>
        </div>

    </div>
</div>

<script>
function toggleMode(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
